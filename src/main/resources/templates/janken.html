<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <title>janken game</title>
</head>

<body>
  <h1>じゃんけんゲーム</h1>
  <div th:if="${name}">
    Hi [[${name}]]
  </div>
  <p>手を選んでください</p>
  <a th:href="@{/jankengame(hand='グー')}">グー</a>
  <a th:href="@{/jankengame(hand='チョキ')}">チョキ</a>
  <a th:href="@{/jankengame(hand='パー')}">パー</a>
  <div th:if="${result}">
    <p>あなたの手：[[${playerHand}]]</p>
    <p>相手の手：[[${cpuHand}]]</p>
    <p>結果：[[${result}]]</p>
  </div>

  <h1>Hi! [[${login_user}]]</h1>
  <h2>エントリー</h2>
  <ol>
    <li th:each="user : ${entry.users}">[[${user}]]</li>
  </ol>

  <div><a href="/logout">ログアウト</a></div>

  <a href="/janken">エントリー</a>
  <ul>
    <li th:each="user : ${users}">[[${user.userName}]]</li>
  </ul>
  <P>
</body>

</html>
