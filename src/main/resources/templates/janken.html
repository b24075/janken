<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <title>janken game</title>
</head>

<body>
  <h1>じゃんけんゲーム</h1>
  <div th:if="${name}">
    Hi [[${name}]]
  </div>

  <h1>Hi! [[${login_user}]]</h1>
  <h2>エントリー</h2>

  <ul>
    <li th:each="user : ${users}"><a th:href="@{/match(id=${user.id})}"> [[${user.userName}]]</a></li>
  </ul>
  <P>

  <h2>アクティブな試合</h2>
  <div th:each="mi : ${activeMatches}">
    <p>
      ID: [[${mi.id}]]
      user1：[[${mi.user1}]]
      user2：[[${mi.user2}]]
    </p>
  </div>

  <h2>試合結果</h2>
  <div th:each="match : ${matches}">
    <p>
      ID: [[${match.id}]]
      user1：[[${match.user1}]]
      user2：[[${match.user2}]]
      user1の手：[[${match.user1Hand}]]
      user2の手：[[${match.user2Hand}]]
    </p>
  </div>

  <div><a href="/logout">ログアウト</a></div>
</body>

</html>
